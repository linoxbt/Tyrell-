[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
# Probe P-4: QIE mainnet and testnet support PUSH0 but no Cancun opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
qie = "https://rpc5mainnet.qie.digital"
qie_testnet = "https://rpc5testnet.qie.digital"

[etherscan]
# Blockscout v7.0.2 (probe P-8); no API key needed.
qie = { key = "none", chain = 1990, url = "https://mainnet.qie.digital/api/" }
qie_testnet = { key = "none", chain = 1983, url = "https://testnet.qie.digital/api/" }
